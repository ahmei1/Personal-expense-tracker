services:
  - type: web
    name: Personal-expense-tracker
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: personal-expense-tracker-db
          property: connectionString
      - key: CLIENT_URL
        sync: false

databases:
  - name: personal-expense-tracker-db
    plan: free
    region: frankfurt
    databaseName: expense_tracker
    postgresMajorVersion: "18"
